<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duration Forecaster</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5d6672; --line:#dde1e6; --accent:#2f5fd0; --blue:#2f5fd0; --red:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171b; --card:#1c2026; --ink:#e8ebef; --muted:#9aa4b0; --line:#2c333b; --accent:#7ba0ff; --blue:#7ba0ff; --red:#ef7b6f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 20px; }
  .banner { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); padding:10px 14px; border-radius:6px; margin-bottom:18px; color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:640px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .card h2 { font-size:14px; margin:0 0 10px; text-transform:uppercase; letter-spacing:.06em; }
  .blue h2 { color:var(--blue); } .red h2 { color:var(--red); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 2px; }
  input, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); font:inherit; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  @media (max-width:640px) { .row { grid-template-columns:1fr; } }
  button { margin-top:16px; padding:10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  #out { margin-top:20px; } .big { font-size:34px; font-weight:700; } .muted { color:var(--muted); font-size:13px; }
  .bar { position:relative; height:10px; background:var(--line); border-radius:5px; margin:12px 0 4px; }
  .bar span { position:absolute; top:0; bottom:0; background:var(--accent); opacity:.35; border-radius:5px; }
  .bar i { position:absolute; top:-3px; width:3px; height:16px; background:var(--accent); }
  .err { color:var(--red); }
</style>
</head>
<body>
<main>
  <h1>Duration Forecaster</h1>
  <p class="sub">Forecast game length from the draft, then update it with the 15:00 gold lead.</p>
  <div class="banner" id="banner">Loading model…</div>
  <div class="grid">
    <div class="card blue"><h2>Blue side</h2><div id="blue"></div></div>
    <div class="card red"><h2>Red side</h2><div id="red"></div></div>
  </div>
  <div class="row">
    <div><label for="league">League</label><select id="league"></select></div>
    <div><label for="lead">Gold lead at 15:00 (thousands, optional)</label><input id="lead" type="number" step="0.1" placeholder="e.g. 2.4"></div>
    <div><label for="cutoff">P(game ends by … min) (optional)</label><input id="cutoff" type="number" step="0.5" placeholder="e.g. 30"></div>
  </div>
  <button id="go">Forecast</button>
  <div id="out" class="card" hidden></div>
</main>
<script>
const $ = id => document.getElementById(id);
let meta;
function slot(side, pos) {
  const opts = meta.champions[pos].map(c => `<option>${c}</option>`).join('');
  return `<label>${pos.toUpperCase()}</label><select id="${side}-${pos}"><option value="">(none)</option>${opts}</select>`;
}
fetch('/api/meta').then(r => r.json()).then(m => {
  meta = m;
  for (const side of ['blue', 'red']) $(side).innerHTML = m.positions.map(p => slot(side, p)).join('');
  $('league').innerHTML = m.leagues.map(l => `<option>${l}</option>`).join('');
  $('banner').textContent = (m.synthetic ? 'Demo mode: trained on synthetic matches with fictional champions. ' : '')
    + `Trained on ${m.n_train} games. Forecast spread (σ) ≈ ${m.sigma.toFixed(1)} min — the draft explains only a small share of game length.`;
});
$('go').onclick = async () => {
  const pick = side => Object.fromEntries(meta.positions.map(p => [p, $(`${side}-${p}`).value]).filter(x => x[1]));
  const body = { blue: pick('blue'), red: pick('red'), league: $('league').value };
  if ($('lead').value !== '') body.lead15_k = parseFloat($('lead').value);
  if ($('cutoff').value !== '') body.cutoff_min = parseFloat($('cutoff').value);
  const r = await fetch('/api/forecast', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json(); const out = $('out'); out.hidden = false;
  if (!r.ok) { out.innerHTML = `<span class="err">${d.error}</span>`; return; }
  const lo = 20, hi = 46, pos = v => Math.min(100, Math.max(0, (v - lo) / (hi - lo) * 100));
  let html = `<div class="big">${d.pred_min.toFixed(1)} min</div><div class="muted">80% interval ${d.lo80.toFixed(1)} – ${d.hi80.toFixed(1)} min · ${d.known_champion_slots} champion slots seen in training</div>
    <div class="bar"><span style="left:${pos(d.lo80)}%;width:${pos(d.hi80) - pos(d.lo80)}%"></span><i style="left:${pos(d.pred_min)}%"></i></div>`;
  if (d.live_pred_min !== undefined) html += `<p>Live nowcast: <b>${d.live_pred_min.toFixed(1)} min</b> <span class="muted">(forecast adjusted for the 15:00 gold lead)</span></p>`;
  if (d.p_ends_by_cutoff !== undefined) html += `<p>P(game ends by ${$('cutoff').value} min) = <b>${(d.p_ends_by_cutoff * 100).toFixed(0)}%</b></p>`;
  out.innerHTML = html;
};
</script>
</body>
</html>
